name: CI — Lint & Validate

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: pip install flake8 black isort

      - name: Run Black (formatter check)
        run: black --check --diff .

      - name: Run isort (import order check)
        run: isort --check-only --diff .

      - name: Run flake8 (style + errors)
        run: flake8 . --max-line-length=100 --exclude=__pycache__,.git,models

  validate-structure:
    name: Project Structure Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in requirements.txt Dockerfile docker-compose.yml \
                   core/pipeline.py core/deepsort_tracker.py core/gpu_config.py \
                   api/main.py dashboard/app.py \
                   utils/speed.py utils/helmet.py utils/plate_ocr.py \
                   utils/alert.py utils/logger.py; do
            [ -f "$f" ] && echo "✅ $f" || (echo "❌ MISSING: $f" && exit 1)
          done
